[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hjm"
version = "0.1.0"
description = "Honjo Masamune: a converter and a cut-primitive language for cheminformatics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kundai Farai Sachikonye"}]
dependencies = []

[project.optional-dependencies]
fast = ["networkx>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
hjm = "hjm.cli:main"

[tool.setuptools.packages.find]
include = ["hjm*"]
